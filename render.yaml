services:
  - type: web
    name: fixpromax-erp
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Secretos — se gestionan en el panel de Render, no en este archivo ──
      - key: MONGODB_URI
        sync: false
      - key: PASSWORD_SALT
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_MIGRATE_KEY
        sync: false
      - key: ADMIN_FIX_KEY
        sync: false
      - key: ULTRAMSG_INSTANCE
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
